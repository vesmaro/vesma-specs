# Негативная фикстура: зарезервированное имя компонента venv.
# Имена venv/venvs зарезервированы за venv-каталогами лэйаута
# (specs/layout/v1 §3.8); валидатор манифестов обязан отвергать
# (spec.md §3.3; проверка name_not_reserved + not.enum схемы).
apiVersion: vesma.component/v1
kind: child-process
metadata:
  name: venv
  version: 1.0.0
  tier: optional
  description: "Валидный во всём остальном манифест, испорченный зарезервированным именем venv."
  provenance:
    repo: https://github.com/vesmaro/vesma
    license: Apache-2.0
launch:
  argv: ["/usr/bin/vesma-reserved", "--config", "{config_path}"]
  cwd: "~/.local/share/vesma/reserved"
  env:
    vars:
      LOG_LEVEL: info
    env_file: "~/.config/vesma/env/reserved.env"
health:
  checker: http
  http:
    url: "http://127.0.0.1:8099/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
