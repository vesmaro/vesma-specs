# Негативная фикстура: shell-метасимволы в элементе argv при валидном типе.
# argv — массив строк (тип корректен), но элемент содержит ';' и whitespace:
# такие элементы = reject, shell-инъекция невозможна по построению
# (spec.md §3.5, SHELL_IN_ARGV).
apiVersion: vesma.component/v1
kind: child-process
metadata:
  name: mesh-shell-metachars
  version: 1.4.2
  tier: optional
  description: "Mesh-агент: валидный манифест, испорченный метасимволами в argv."
  provenance:
    repo: https://github.com/vesmaro/vesma-mesh
    license: Apache-2.0
launch:
  argv: ["/usr/bin/tool", "--flag;rm -rf /"]
  cwd: "~/.local/share/vesma/mesh"
  env:
    vars:
      MESH_LOG_LEVEL: info
    env_file: "~/.config/vesma/env/mesh.env"
health:
  checker: http
  http:
    url: "http://127.0.0.1:8091/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
