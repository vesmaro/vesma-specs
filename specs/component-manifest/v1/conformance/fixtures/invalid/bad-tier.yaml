# Негативная фикстура: tier вне enum (core | optional).
# "critical" — не существующий тир; рестарт-политики определены только для
# core/optional (spec.md §3.3, specs/service-lifecycle/v1 §3.5).
apiVersion: vesma.component/v1
kind: child-process
metadata:
  name: mesh-bad-tier
  version: 1.4.2
  tier: critical
  description: "Mesh-агент: валидный манифест, испорченный плохим тиром."
  provenance:
    repo: https://github.com/vesmaro/vesma-mesh
    license: Apache-2.0
launch:
  argv: ["/usr/bin/vesma-mesh", "--config", "{config_path}"]
  cwd: "~/.local/share/vesma/mesh"
  env:
    vars:
      MESH_LOG_LEVEL: info
    env_file: "~/.config/vesma/env/mesh.env"
health:
  checker: http
  http:
    url: "http://127.0.0.1:8091/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
