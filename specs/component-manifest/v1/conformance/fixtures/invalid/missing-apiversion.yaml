# Негативная фикстура: отсутствует apiVersion.
# apiVersion обязателен; неподдерживаемая/отсутствующая версия = reject,
# ошибка обязана содержать массив поддерживаемых версий (spec.md §3.2).
kind: child-process
metadata:
  name: mesh
  version: 1.4.2
  tier: optional
  description: "Mesh-агент: валидный манифест без apiVersion."
  provenance:
    repo: https://github.com/vesmaro/vesma-mesh
    license: Apache-2.0
launch:
  argv: ["/usr/bin/vesma-mesh", "--config", "{config_path}"]
  cwd: "~/.local/share/vesma/mesh"
  env:
    vars:
      MESH_LOG_LEVEL: info
    env_file: "~/.config/vesma/env/mesh.env"
health:
  checker: http
  http:
    url: "http://127.0.0.1:8091/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
