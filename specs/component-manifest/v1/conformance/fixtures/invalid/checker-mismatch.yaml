# Негативная фикстура: health.checker не соответствует пробному блоку.
# checker: tcp, но заполнен блок http, tcp-блока нет — мёртвая конфигурация
# недопустима (spec.md §3.7; проверка checker_block_consistency).
apiVersion: vesma.component/v1
kind: child-process
metadata:
  name: mesh-checker-mismatch
  version: 1.4.2
  tier: optional
  description: "Mesh-агент: валидный манифест, испорченный несоответствием checker и блока."
  provenance:
    repo: https://github.com/vesmaro/vesma-mesh
    license: Apache-2.0
launch:
  argv: ["/usr/bin/vesma-mesh", "--config", "{config_path}"]
  cwd: "~/.local/share/vesma/mesh"
  env:
    vars:
      MESH_LOG_LEVEL: info
    env_file: "~/.config/vesma/env/mesh.env"
health:
  checker: tcp
  http:
    url: "http://127.0.0.1:8091/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
