# Негативная фикстура: имя компонента вне шаблона ^[a-z][a-z0-9-]{0,62}$.
# "Mesh_1" содержит заглавные буквы и подчёркивание — reject на валидации
# имени (spec.md §3.3; проверка name_kebab_unique, ветка шаблона).
apiVersion: vesma.component/v1
kind: child-process
metadata:
  name: Mesh_1
  version: 1.4.2
  tier: optional
  description: "Mesh-агент: валидный манифест, испорченный именем вне шаблона."
  provenance:
    repo: https://github.com/vesmaro/vesma-mesh
    license: Apache-2.0
launch:
  argv: ["/usr/bin/vesma-mesh", "--config", "{config_path}"]
  cwd: "~/.local/share/vesma/mesh"
  env:
    vars:
      MESH_LOG_LEVEL: info
    env_file: "~/.config/vesma/env/mesh.env"
health:
  checker: http
  http:
    url: "http://127.0.0.1:8091/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
