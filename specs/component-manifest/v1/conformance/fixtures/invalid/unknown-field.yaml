# Негативная фикстура: неизвестное поле верхнего уровня.
# strict validation: additionalProperties: false — неизвестное поле = reject,
# никакое «протаскивание мусора» не допускается. Поле `replicas` — кандидат
# v2, сегодня заведомо вне контракта (spec.md §7).
apiVersion: vesma.component/v1
kind: child-process
metadata:
  name: mesh-unknown-field
  version: 1.4.2
  tier: optional
  description: "Mesh-агент: валидный манифест, испорченный одним неизвестным полем."
  provenance:
    repo: https://github.com/vesmaro/vesma-mesh
    license: Apache-2.0
launch:
  argv: ["/usr/bin/vesma-mesh", "--config", "{config_path}"]
  cwd: "~/.local/share/vesma/mesh"
  env:
    vars:
      MESH_LOG_LEVEL: info
    env_file: "~/.config/vesma/env/mesh.env"
health:
  checker: http
  http:
    url: "http://127.0.0.1:8091/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
replicas: 2
