# Негативная фикстура: секретное имя ключа в launch.env.vars.
# Значение — плейсхолдер (реальных секретов в репе нет); reject происходит
# по ИМЕНИ ключа (token) — секреты живут только в env_file (spec.md §3.5).
apiVersion: vesma.component/v1
kind: child-process
metadata:
  name: mesh-secret-vars
  version: 1.4.2
  tier: optional
  description: "Mesh-агент: валидный манифест, испорченный секретом в env.vars."
  provenance:
    repo: https://github.com/vesmaro/vesma-mesh
    license: Apache-2.0
launch:
  argv: ["/usr/bin/vesma-mesh", "--config", "{config_path}"]
  cwd: "~/.local/share/vesma/mesh"
  env:
    vars:
      MESH_API_TOKEN: "<token>"
    env_file: "~/.config/vesma/env/mesh.env"
health:
  checker: http
  http:
    url: "http://127.0.0.1:8091/healthz"
    interval: 10s
    timeout: 2s
    unhealthy_threshold: 3
stop:
  signal: SIGTERM
  grace_period: 10s
